name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openaiops
          POSTGRES_PASSWORD: openaiops
          POSTGRES_DB: openaiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openaiops:openaiops@localhost:5432/openaiops?schema=public
      NEXTAUTH_SECRET: ci-secret
      INGEST_API_KEYS: dev_ingest_key
      ALLOW_IN_MEMORY_RATE_LIMIT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Generate and commit deterministic lockfile
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Add deterministic npm lockfile'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: docker build -t openai-operations-dashboard:ci .
