name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openaiops
          POSTGRES_PASSWORD: openaiops
          POSTGRES_DB: openaiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openaiops:openaiops@localhost:5432/openaiops?schema=public
      NEXTAUTH_SECRET: ci-secret
      INGEST_API_KEYS: dev_ingest_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  heavy-assurance:
    needs: quality
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://openaiops:openaiops@localhost:5432/openaiops?schema=public
      NEXTAUTH_SECRET: ci-secret
      INGEST_API_KEYS: dev_ingest_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
      - run: docker build -t openai-operations-dashboard:ci .
