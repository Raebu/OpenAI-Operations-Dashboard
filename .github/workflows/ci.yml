name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openaiops
          POSTGRES_PASSWORD: openaiops
          POSTGRES_DB: openaiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openaiops -d openaiops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openaiops:openaiops@localhost:5432/openaiops?schema=public
      NEXTAUTH_SECRET: ci-secret
      INGEST_API_KEYS: dev_ingest_key
      ALLOW_IN_MEMORY_RATE_LIMIT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Refresh deterministic lockfile
        run: |
          rm -f package-lock.json
          npx --yes npm@12.0.2 install --package-lock-only --ignore-scripts --no-audit
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Refresh deterministic npm lockfile'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - id: install
        name: Install dependencies
        run: npx --yes npm@12.0.2 ci

      - id: audit
        name: Dependency audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx --yes npm@12.0.2 audit --audit-level=high

      - id: prisma
        name: Generate Prisma client
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx prisma generate

      - id: lint
        name: Lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - id: typecheck
        name: Typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - id: test
        name: Test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test

      - id: build
        name: Build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - id: container
        name: Build container
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: docker build -t openai-operations-dashboard:ci .

      - name: Enforce all quality gates
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PRISMA: ${{ steps.prisma.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CONTAINER: ${{ steps.container.outcome }}
        run: |
          printf '%s\n' "install=$INSTALL audit=$AUDIT prisma=$PRISMA lint=$LINT typecheck=$TYPECHECK test=$TEST build=$BUILD container=$CONTAINER"
          test "$INSTALL" = success
          test "$AUDIT" = success
          test "$PRISMA" = success
          test "$LINT" = success
          test "$TYPECHECK" = success
          test "$TEST" = success
          test "$BUILD" = success
          test "$CONTAINER" = success
