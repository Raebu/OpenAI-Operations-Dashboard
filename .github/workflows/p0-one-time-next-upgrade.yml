name: P0 one-time web dependency and lockfile remediation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  upgrade-test:
    if: github.event.pull_request.head.ref == 'fix/p0-next-modernize-lockfile-20261015' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openaiops
          POSTGRES_PASSWORD: openaiops
          POSTGRES_DB: openaiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openaiops -d openaiops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openaiops:openaiops@localhost:5432/openaiops?schema=public
      NEXTAUTH_SECRET: ci-secret
      INGEST_API_KEYS: dev_ingest_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.2'
      - name: Install compatible patched framework and React; create deterministic lockfile
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund next@16.4.1 react@19.3.0 react-dom@19.3.0
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund eslint-config-next@16.4.1 @types/react@19.3.0 @types/react-dom@19.3.0
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npx prisma generate
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit only verified application dependencies and remove temporary helper
        run: |
          git rm .github/workflows/p0-one-time-next-upgrade.yml
          git add package.json package-lock.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): upgrade framework and lock dependencies'
          git push origin HEAD:fix/p0-next-modernize-lockfile-20261015
